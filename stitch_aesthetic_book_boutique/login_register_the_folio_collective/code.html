<body class="bg-background text-on-background min-h-screen flex antialiased">

<div class="absolute inset-0 bg-cover bg-center" data-alt="A softly lit, close-up view of a cozy reading nook in a high-end minimalist interior. Gentle sunlight filters across a stack of beautifully bound linen books resting on a light oak table. The color palette is warm and restrained, dominated by paper whites, soft cream, and muted natural wood tones. The atmosphere is quiet, scholarly, and serene, embodying the tactile luxury of a private library." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDgFQTgwjVdtpNHw7-gd7PXH2WNeb5aG3Lir3Tk9NgeDut9g4yFVNWUYUW6Ff3_46wfy6syCwfdXwkiWw40WLCIpsnrYyVG_k7FAzBgxxRehXqsVD_wd4jVMY6CIA0BTTAY2pFHviaZkD9FBIpjDl4w3I0-DEGuHyMPbRRI6f4-NFWeSGYYOqHoHa4aeNYPJjw29UO2N_afh-ykc0mOC2mPOHRBgfwxR0YgwCSZyv6OIotCVfucGCtGZRezrCuIfPFaAQB3rPVYSWw');">

<div class="flex-1 flex flex-col justify-center px-margin-mobile lg:px-margin-desktop py-section-gap bg-background w-full max-w-2xl mx-auto lg:mx-0">
<!-- Brand / Back Action -->

<!-- Form Area -->
<div class="w-full">
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-12">
<button class="pb-3 px-1 mr-8 border-b border-primary text-primary font-label-md text-label-md uppercase tracking-wider">Sign In</button>
<button class="pb-3 px-1 text-on-surface-variant hover:text-primary transition-colors border-b border-transparent font-label-md text-label-md uppercase tracking-wider">Create Account</button>
</div>
<!-- Welcome Text -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile lg:font-headline-lg lg:text-headline-lg text-primary mb-2">Welcome back.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Access your curated library and continued readings.</p>
</div>
<!-- Input Fields -->
<form class="space-y-8">
<div class="relative">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant block mb-2" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 font-body-md text-body-md text-primary focus:ring-0 focus:border-secondary transition-colors" id="email" name="email" placeholder="reader@example.com" type="email">
</div>
<div class="relative">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant block mb-2 flex justify-between" for="password">
<span class="">Password</span>
<a class="text-primary hover:text-secondary transition-colors" href="#">Forgot?</a>
</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 font-body-md text-body-md text-primary focus:ring-0 focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••" type="password">
</div>
<!-- Actions -->
<div class="pt-6">
<button class="w-full bg-primary text-on-primary py-4 px-gutter font-label-md text-label-md uppercase tracking-wider hover:bg-surface-tint transition-all duration-300" type="submit">
                            Enter the Library
                        </button>
</div>
</form>
<div class="mt-12 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                        By continuing, you agree to our <a class="text-primary underline" href="#">Terms of Service</a> and <a class="text-primary underline" href="#">Privacy Policy</a>.
                    </p>
